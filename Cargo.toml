[package]
name = "code-radio-cli"
description = "A command line music radio client for https://coderadio.freecodecamp.org"
version = "1.0.5"
authors = ["Jason Wei"]
edition = "2021"
readme = "README.md"

homepage = "https://github.com/JasonWei512/code-radio-cli"
repository = "https://github.com/JasonWei512/code-radio-cli"

keywords = ["cli", "music", "freecodecamp", "code-radio"]
categories = ["command-line-utilities"]
license = "MIT"

[[bin]]
name = "code-radio"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.45.1", features = ["full"] }
anyhow = "1.0.98"
once_cell = "1.21.3"
futures-util = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rodio = "0.20.1"
reqwest = { version = "0.12.19", features = ["blocking", "json"] }
minimp3_fixed = "0.5.4"
clap = { version = "4.5.39", features = ["derive"] }
indicatif = "0.17.11"
console = "0.15.11"
colored = "3.0.0"
version-compare = "0.2.0"
inquire = { version = "0.7.5", default-features = false, features = ["console"] }
eventsource-client = "0.15.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
